<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteBox — Мои рецепты</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Наш CSS -->
    <link
        href="css/style.css"
        rel="stylesheet"
    >

</head>

<body>


<!-- НАВИГАЦИЯ -->

<nav class="navbar sticky-top">

    <div class="container py-2">

        <a href="index.html" class="brand">
            Bite<span>Box</span>
        </a>

        <a
            href="add.html"
            class="btn btn-primary rounded-pill px-3"
        >
            + Добавить рецепт
        </a>

    </div>

</nav>


<!-- ГЛАВНАЯ СТРАНИЦА -->

<main class="container">


    <!-- ЗАГОЛОВОК -->

    <section class="hero">

        <h1 class="display-6 mb-2">
            Мои рецепты 🍴
        </h1>

        <p class="mb-0">
            Сохраняй любимые блюда в одном месте.
        </p>

    </section>


    <!-- ФИЛЬТРЫ -->

    <!-- ФИЛЬТРЫ -->

<section class="mb-4">

    <div class="filter-scroll">

        <button
            type="button"
            class="filter-btn active"
            data-category="Все"
        >
            Все
        </button>

        <button
            type="button"
            class="filter-btn"
            data-category="Салаты"
        >
            🥗 Салаты
        </button>

        <button
            type="button"
            class="filter-btn"
            data-category="Выпечка"
        >
            🥧 Выпечка
        </button>

        <button
            type="button"
            class="filter-btn"
            data-category="Быстрые ужины"
        >
            ⏱️ Быстрые ужины
        </button>

    </div>

</section>


    <!-- СЕТКА РЕЦЕПТОВ -->

    <!-- СЕТКА РЕЦЕПТОВ -->

<section
    class="row g-4 pb-5"
    id="recipesContainer"
>
</section>

</main>


<!-- JavaScript -->

<script src="js/app.js"></script>

</body>

</html>
