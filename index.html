<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox — Мои рецепты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bb-primary: #ff6b4a;
            --bb-primary-dark: #e95738;
            --bb-bg: #f8f7f4;
            --bb-text: #252525;
            --bb-muted: #777;
        }

        body {
            background: var(--bb-bg);
            color: var(--bb-text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #eee;
        }

        .brand {
            color: var(--bb-text);
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .brand span {
            color: var(--bb-primary);
        }

        .btn-primary {
            background: var(--bb-primary);
            border-color: var(--bb-primary);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: var(--bb-primary-dark);
            border-color: var(--bb-primary-dark);
        }

        .hero {
            padding: 42px 0 25px;
        }

        .hero h1 {
            font-weight: 800;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--bb-muted);
        }

        .filter-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            white-space: nowrap;
            border: 1px solid #e5e3df;
            background: white;
            color: #555;
            border-radius: 999px;
            padding: 9px 17px;
            transition: .2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--bb-text);
            border-color: var(--bb-text);
            color: white;
        }

        .recipe-card {
            border: 0;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .07);
            transition: transform .2s ease, box-shadow .2s ease;
            height: 100%;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, .11);
        }

        .recipe-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .recipe-card .card-body {
            padding: 20px;
        }

        .recipe-card h5 {
            font-weight: 750;
            margin-bottom: 12px;
        }

        .badge-tag {
            background: #f1f0ed;
            color: #5f5c57;
            font-weight: 500;
            padding: 7px 10px;
            border-radius: 999px;
        }

        .recipe-card .btn {
            border-radius: 12px;
        }

        @media (max-width: 575px) {
            .recipe-image {
                height: 220px;
            }

            .hero {
                padding-top: 30px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar sticky-top">
    <div class="container py-2">
        <a href="index.html" class="brand">Bite<span>Box</span></a>

        <a href="add.html" class="btn btn-primary rounded-pill px-3">
            + Добавить рецепт
        </a>
    </div>
</nav>

<main class="container">

    <section class="hero">
        <h1 class="display-6 mb-2">Мои рецепты 🍴</h1>
        <p class="mb-0">Сохраняй любимые блюда в одном месте.</p>
    </section>

    <section class="mb-4">
        <div class="filter-scroll">
            <button class="filter-btn active">Все</button>
            <button class="filter-btn">🥗 Салаты</button>
            <button class="filter-btn">🥧 Выпечка</button>
            <button class="filter-btn">⏱️ Быстрые ужины</button>
        </div>
    </section>

    <section class="row g-4 pb-5">

        <div class="col-12 col-sm-6 col-lg-4">
            <article class="card recipe-card">
                <img
                    class="recipe-image"
                    src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=900&q=80"
                    alt="Свежий овощной салат"
                >

                <div class="card-body">
                    <h5>Свежий овощной салат</h5>

                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <span class="badge badge-tag">🥗 Салаты</span>
                        <span class="badge badge-tag">Лёгкий</span>
                    </div>

                    <a href="recipe.html" class="btn btn-dark w-100">
                        Смотреть
                    </a>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <article class="card recipe-card">
                <img
                    class="recipe-image"
                    src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=80"
                    alt="Домашняя пицца"
                >

                <div class="card-body">
                    <h5>Домашняя пицца</h5>

                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <span class="badge badge-tag">🍕 Выпечка</span>
                        <span class="badge badge-tag">Сытное</span>
                    </div>

                    <a href="recipe.html" class="btn btn-dark w-100">
                        Смотреть
                    </a>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <article class="card recipe-card">
                <img
                    class="recipe-image"
                    src="https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=900&q=80"
                    alt="Рис с овощами"
                >

                <div class="card-body">
                    <h5>Рис с овощами</h5>

                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <span class="badge badge-tag">⏱️ Быстрый ужин</span>
                        <span class="badge badge-tag">Вегетарианское</span>
                    </div>

                    <a href="recipe.html" class="btn btn-dark w-100">
                        Смотреть
                    </a>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <article class="card recipe-card">
                <img
                    class="recipe-image"
                    src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=900&q=80"
                    alt="Сырный пирог"
                >

                <div class="card-body">
                    <h5>Сырный пирог</h5>

                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <span class="badge badge-tag">🥧 Выпечка</span>
                        <span class="badge badge-tag">Сыр</span>
                    </div>

                    <a href="recipe.html" class="btn btn-dark w-100">
                        Смотреть
                    </a>
                </div>
            </article>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <article class="card recipe-card">
                <img
                    class="recipe-image"
                    src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80"
                    alt="Зелёный боул"
                >

                <div class="card-body">
                    <h5>Зелёный боул</h5>

                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <span class="badge badge-tag">🥗 Салаты</span>
                        <span class="badge badge-tag">Полезное</span>
                    </div>

                    <a href="recipe.html" class="btn btn-dark w-100">
                        Смотреть
                    </a>
                </div>
            </article>
        </div>

    </section>
</main>
<script src="app.js"></script>
</body>
</html>
