<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteBox — Сырный пирог</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Наш CSS -->
    <link
        href="css/style.css"
        rel="stylesheet"
    >

</head>

<body>


<main class="recipe-wrapper">


    <!-- НАЗАД -->

    <a
        href="index.html"
        class="back-link d-inline-block mb-4"
    >
        ← Назад
    </a>


    <!-- ОСНОВНАЯ ИНФОРМАЦИЯ -->

    <article class="recipe-hero mb-4">


        <!-- ФОТОГРАФИЯ -->

       <img
    id="recipeImageDetail"
    class="hero-image"
    src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=1400&q=85"
    alt="Фотография блюда"
>


        <!-- НАЗВАНИЕ И ТЕГИ -->

        <div class="recipe-header">

           <h1
    id="recipeTitle"
    class="recipe-title mb-3"
>
    Название рецепта
</h1>

            <div
    id="recipeCategories"
    class="d-flex flex-wrap gap-2"
>
</div>

        </div>


    </article>


    <!-- ИНГРЕДИЕНТЫ И ШАГИ -->

    <div class="row g-4">


        <!-- ИНГРЕДИЕНТЫ -->

        <div class="col-12 col-lg-5">

            <section class="content-card">

                <h2>
                    🛒 Ингредиенты
                </h2>

                <ul
    id="recipeIngredientsList"
    class="ingredients-list"
>
</ul>
            </section>

        </div>


        <!-- ШАГИ ПРИГОТОВЛЕНИЯ -->

        <div class="col-12 col-lg-7">

            <section class="content-card">

                <h2>
                    👨‍🍳 Шаги приготовления
                </h2>

                <ol
    id="recipeStepsList"
    class="steps-list"
>
</ol>

            </section>

        </div>


    </div>


</main>


<!-- JavaScript -->

<script src="js/app.js"></script>

</body>

</html>
