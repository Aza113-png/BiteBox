<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteBox — Добавить рецепт</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Наш CSS -->
    <link
        href="css/style.css"
        rel="stylesheet"
    >

</head>

<body>


<main class="page-wrapper">


    <!-- КНОПКА НАЗАД -->

    <a
        href="index.html"
        class="back-link d-inline-block mb-4"
    >
        ← Назад
    </a>


    <!-- ЗАГОЛОВОК -->

    <div class="mb-4">

        <h1 class="page-title mb-2">
            Добавить рецепт ✨
        </h1>

        <p class="text-secondary mb-0">
            Сохрани любимое блюдо,
            чтобы быстро найти его позже.
        </p>

    </div>


    <!-- ФОРМА -->

    <form id="recipeForm" class="form-card">


        <!-- НАЗВАНИЕ -->

        <div class="mb-4">

            <label
                for="recipeName"
                class="form-label"
            >
                Название рецепта
            </label>

            <input
                type="text"
                class="form-control"
                id="recipeName"
                placeholder="Например, Сырный пирог"
                required
            >

        </div>


        <!-- ФОТОГРАФИЯ -->

        <div class="mb-4">

            <label
                for="recipeImage"
                class="form-label"
            >
                Ссылка на фотографию
            </label>

            <input
                type="url"
                class="form-control"
                id="recipeImage"
                placeholder="https://images.unsplash.com/..."
            >

            <div class="form-text">
                Вставь прямую ссылку на изображение блюда.
            </div>

        </div>


        <!-- ИНГРЕДИЕНТЫ -->

        <div class="mb-4">

            <label
                for="recipeIngredients"
                class="form-label"
            >
                Ингредиенты
            </label>

            <textarea
                class="form-control"
                id="recipeIngredients"
                placeholder="200 г муки&#10;150 г сыра&#10;2 яйца"
                rows="6"
                required
            ></textarea>

            <div class="form-text">
                Каждый ингредиент указывай с новой строки.
            </div>

        </div>


        <!-- ШАГИ ПРИГОТОВЛЕНИЯ -->

        <div class="mb-4">

            <label
                for="recipeSteps"
                class="form-label"
            >
                Шаги приготовления
            </label>

            <textarea
                class="form-control"
                id="recipeSteps"
                placeholder="Подготовить ингредиенты&#10;Замесить тесто&#10;Выпекать 30 минут"
                rows="6"
                required
            ></textarea>

            <div class="form-text">
                Каждый шаг приготовления указывай с новой строки.
            </div>

        </div>


        <!-- КАТЕГОРИИ -->

        <div class="mb-4">

            <label class="form-label d-block">
                Категории
            </label>

            <div class="category-box">


                <!-- САЛАТЫ -->

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="category"
                        value="Салаты"
                        id="tagSalads"
                    >

                    <label
                        class="form-check-label"
                        for="tagSalads"
                    >
                        🥗 Салаты
                    </label>

                </div>


                <!-- ВЫПЕЧКА -->

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="category"
                        value="Выпечка"
                        id="tagBaking"
                    >

                    <label
                        class="form-check-label"
                        for="tagBaking"
                    >
                        🥧 Выпечка
                    </label>

                </div>


                <!-- БЫСТРЫЕ УЖИНЫ -->

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="category"
                        value="Быстрые ужины"
                        id="tagQuick"
                    >

                    <label
                        class="form-check-label"
                        for="tagQuick"
                    >
                        ⏱️ Быстрые ужины
                    </label>

                </div>


            </div>

        </div>


        <!-- СОХРАНЕНИЕ -->

        <button
            type="submit"
            class="btn btn-primary save-btn w-100"
        >
            Сохранить рецепт
        </button>


    </form>

</main>


<!-- JavaScript -->

<script src="js/app.js"></script>

</body>

</html>
