<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteBox — Добавить рецепт</title>

    <!-- Подключение Bootstrap 5 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --bb-primary: #ff6b4a;
            --bb-primary-dark: #e95738;
            --bb-bg: #f8f7f4;
            --bb-text: #252525;
        }

        body {
            background: var(--bb-bg);
            color: var(--bb-text);

            font-family: Inter, system-ui,
            -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
        }

        .page-wrapper {
            max-width: 760px;
            margin: 0 auto;
            padding: 25px 15px 60px;
        }

        .back-link {
            color: #555;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--bb-primary);
        }

        .page-title {
            font-weight: 800;
            letter-spacing: -.8px;
        }

        .form-card {
            background: white;
            border: 0;
            border-radius: 24px;
            padding: 25px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, .07);
        }

        .form-label {
            font-weight: 650;
            margin-bottom: 8px;
        }

        .form-control {
            border: 1px solid #e4e2de;
            border-radius: 13px;
            padding: 12px 14px;
        }

        .form-control:focus {
            border-color: var(--bb-primary);

            box-shadow: 0 0 0 .2rem rgba(
                255, 107, 74, .12
            );
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        .category-box {
            background: #faf9f7;
            border-radius: 16px;
            padding: 17px;
        }

        .form-check {
            margin-bottom: 10px;
        }

        .form-check:last-child {
            margin-bottom: 0;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--bb-primary);
            border-color: var(--bb-primary);
        }

        .save-btn {
            background: var(--bb-primary);
            border-color: var(--bb-primary);

            border-radius: 14px;
            padding: 14px;

            font-size: 1.05rem;
            font-weight: 700;
        }

        .save-btn:hover {
            background: var(--bb-primary-dark);
            border-color: var(--bb-primary-dark);
        }

    </style>

</head>


<body>


<main class="page-wrapper">


    <!-- КНОПКА НАЗАД -->

    <a
        href="index.html"
        class="back-link d-inline-block mb-4"
    >

        ← Назад

    </a>



    <!-- ЗАГОЛОВОК СТРАНИЦЫ -->

    <div class="mb-4">

        <h1 class="page-title mb-2">

            Добавить рецепт ✨

        </h1>

        <p class="text-secondary mb-0">

            Сохрани любимое блюдо,
            чтобы быстро найти его позже.

        </p>

    </div>



    <!-- ФОРМА ДОБАВЛЕНИЯ РЕЦЕПТА -->

    <form id="recipeForm" class="form-card">



        <!-- НАЗВАНИЕ РЕЦЕПТА -->

        <div class="mb-4">

            <label
                for="recipeName"
                class="form-label"
            >

                Название рецепта

            </label>

            <input

                type="text"

                class="form-control"

                id="recipeName"

                placeholder="Например, Сырный пирог"

                required

            >

        </div>



        <!-- ССЫЛКА НА ФОТОГРАФИЮ -->

        <div class="mb-4">

            <label
                for="recipeImage"
                class="form-label"
            >

                Ссылка на фотографию

            </label>

            <input

                type="url"

                class="form-control"

                id="recipeImage"

                placeholder="https://images.unsplash.com/..."

            >

            <div class="form-text">

                Вставь прямую ссылку на изображение блюда.

            </div>

        </div>



        <!-- ИНГРЕДИЕНТЫ -->

        <div class="mb-4">

            <label
                for="recipeIngredients"
                class="form-label"
            >

                Ингредиенты

            </label>

            <textarea

                class="form-control"

                id="recipeIngredients"

                placeholder="200 г муки&#10;150 г сыра&#10;2 яйца"

                rows="6"

                required

            ></textarea>

            <div class="form-text">

                Каждый ингредиент указывай с новой строки.

            </div>

        </div>



        <!-- ШАГИ ПРИГОТОВЛЕНИЯ -->

        <div class="mb-4">

            <label
                for="recipeSteps"
                class="form-label"
            >

                Шаги приготовления

            </label>

            <textarea

                class="form-control"

                id="recipeSteps"

                placeholder="Подготовить ингредиенты&#10;Замесить тесто&#10;Выпекать 30 минут"

                rows="6"

                required

            ></textarea>

            <div class="form-text">

                Каждый шаг приготовления указывай
                с новой строки.

            </div>

        </div>



        <!-- КАТЕГОРИИ -->

        <div class="mb-4">

            <label class="form-label d-block">

                Категории

            </label>


            <div class="category-box">



                <!-- САЛАТЫ -->

                <div class="form-check">

                    <input

                        class="form-check-input"

                        type="checkbox"

                        name="category"

                        value="Салаты"

                        id="tagSalads"

                    >

                    <label
                        class="form-check-label"
                        for="tagSalads"
                    >

                        🥗 Салаты

                    </label>

                </div>



                <!-- ВЫПЕЧКА -->

                <div class="form-check">

                    <input

                        class="form-check-input"

                        type="checkbox"

                        name="category"

                        value="Выпечка"

                        id="tagBaking"

                    >

                    <label
                        class="form-check-label"
                        for="tagBaking"
                    >

                        🥧 Выпечка

                    </label>

                </div>



                <!-- БЫСТРЫЕ УЖИНЫ -->

                <div class="form-check">

                    <input

                        class="form-check-input"

                        type="checkbox"

                        name="category"

                        value="Быстрые ужины"

                        id="tagQuick"

                    >

                    <label
                        class="form-check-label"
                        for="tagQuick"
                    >

                        ⏱️ Быстрые ужины

                    </label>

                </div>


            </div>

        </div>



        <!-- КНОПКА СОХРАНЕНИЯ -->

        <button

            type="submit"

            class="btn btn-primary save-btn w-100"

        >

            Сохранить рецепт

        </button>



    </form>


</main>



<!-- ПОДКЛЮЧЕНИЕ JAVASCRIPT -->

<script src="app.js"></script>


</body>

</html>
